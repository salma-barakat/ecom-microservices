spring:
  application:
    name: user-service
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE}
    username: ${MONGO_USERNAME}
    password: ${MONGO_PASSWORD}
    authentication-database: admin
    representation:
      uuid: standard

server:
  port: 8082

logging:
  file:
    name: logs/ecommerceUser.log

